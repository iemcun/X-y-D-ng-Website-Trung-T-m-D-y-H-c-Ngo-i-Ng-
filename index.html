<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABC Foreign Language Center - Đăng nhập</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <i class="fa-solid fa-layer-group"></i>
        <span>ABC FOREIGN LANGUAGE CENTER</span>
      </div>
      <div class="header-buttons">
        <a href="#" class="btn-header btn-register">Đăng ký</a>
        <a href="#" class="btn-header btn-contact">Liên hệ</a>
      </div>
    </header>

    <main>
      <div class="login-card">
        <div class="logo-icon">
          <i class="fa-solid fa-shapes"></i>
        </div>
        <h3>ĐĂNG NHẬP HỆ THỐNG</h3>

        <form action="#">
          <div class="input-group">
            <label for="username">Tên đăng nhập</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="username"
                placeholder="Nhập tên đăng nhập"
              />
            </div>
          </div>

          <div class="input-group">
            <label for="password">Mật khẩu</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                placeholder="Nhập mật khẩu"
              />
              <i class="fa-solid fa-eye toggle-password"></i>
            </div>
          </div>

          <div class="options-row">
            <label class="remember-me">
              <input type="checkbox" /> Ghi nhớ đăng nhập
            </label>
            <a href="#" class="forgot-password">Quên mật khẩu?</a>
          </div>

          <button type="submit" class="btn-submit">Đăng nhập</button>

          <div class="register-link">
            Chưa có tài khoản? <a href="#">Đăng ký ngay</a>
          </div>
        </form>
      </div>
    </main>
    <footer>© 2024 ABC Foreign Language Center. All rights reserved.</footer>
  </body>
</html>
